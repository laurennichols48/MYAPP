<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Positioning Playground</title>
    <link rel="stylesheet" href="positioning-playground.css">
  </head>
  <body>
    <header><h1>Positioning Playground</h1></header>
    <main>
      <section>
        <h2>Display Test</h2>
        <p>The highlighted words <span class="display-test">change display</span> while this sentence remains nearby.</p>
      </section>

      <section class="position-stage">
        <h2>Position Test</h2>
        <div class="reference-box">
          Reference container
          <div class="test-box">Test box</div>
        </div>
      </section>

      <section class="long-section">
        <h2>Scroll Test</h2>
        <p>Use this extra space to observe fixed positioning while scrolling.</p>
      </section>
    </main>
  </body>
</html>
