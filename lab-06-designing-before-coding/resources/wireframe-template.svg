  <text x="805" y="35" font-family="Arial" font-size="22">Mobile frame</text>
  <rect x="805" y="55" width="245" height="590" fill="white" stroke="#444" stroke-width="3"/>
  <rect x="825" y="80" width="205" height="85" fill="#eee" stroke="#777"/>
  <text x="845" y="127" font-family="Arial" font-size="16">Header</text>
  <rect x="825" y="185" width="205" height="155" fill="#eee" stroke="#777"/>
  <text x="845" y="265" font-family="Arial" font-size="16">Hero</text>
  <rect x="825" y="360" width="205" height="100" fill="#eee" stroke="#777"/>
  <rect x="825" y="480" width="205" height="100" fill="#eee" stroke="#777"/>
  <text x="845" y="420" font-family="Arial" font-size="16">Section</text>
  <text x="845" y="540" font-family="Arial" font-size="16">Section</text>
  <rect x="825" y="600" width="205" height="25" fill="#eee" stroke="#777"/>
